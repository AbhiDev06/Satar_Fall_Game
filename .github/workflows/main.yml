name: Starfall CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  check-game-files:
    name: Check Starfall Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f index.css
          test -f index.js
          echo "All required Starfall files exist!"

      - name: Validate HTML and JavaScript files
        run: |
          node --check index.js
          echo "JavaScript syntax check passed!"
